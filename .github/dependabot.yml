# Dependabot — GitHub 무료 보안·종속성 자동화
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# public/private repo 모두 무료, 무제한
# 매주 월요일 KST 09:00에 종속성 검사 → PR 자동 생성

version: 2

updates:
  # npm 종속성 (Next.js·React·기타)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    # major 버전 업그레이드는 review 필요 (자동 머지 안 함)
    versioning-strategy: "increase-if-necessary"
    # Next.js·React 메이저 업그레이드는 그룹화하여 한 PR로
    groups:
      next-react:
        patterns:
          - "next*"
          - "react*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
          - "autoprefixer"
        update-types:
          - "minor"
          - "patch"
      types:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions 종속성
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
